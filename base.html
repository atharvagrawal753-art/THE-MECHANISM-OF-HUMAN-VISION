</style><style>.s{z-index:1}#nav{z-index:5}#c3,#lbls{position:fixed;top:0;right:0;width:60vw;height:100%;z-index:0;opacity:0;transition:opacity .8s;pointer-events:none;touch-action:none}body.d3 #c3{opacity:1;pointer-events:auto;cursor:grab}#lbls{z-index:3;opacity:1;overflow:hidden}.lb{position:absolute;left:0;top:0;font-size:12px;color:#fff;background:rgba(5,15,40,.7);border:1px solid var(--c);padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px);opacity:0;pointer-events:none}.lb::before{content:"";position:absolute;left:-9px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--c);transform:translateY(-50%);box-shadow:0 0 8px var(--c)}.lb:hover{background:rgba(53,224,255,.3)}body.d3 .s{pointer-events:none}body.d3 .txt,body.d3 .txt *{pointer-events:auto}.brand{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:5vw;font-size:11px;letter-spacing:.3em;color:var(--m);z-index:4}@media(max-width:800px){#c3,#lbls{width:100%;height:40vh}body.d3 .s{padding-top:42vh}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><style>

<canvas id="c3"></canvas><div id="lbls"></div><div class="brand">THE MECHANISM OF HUMAN VISION</div><div id="deck"></div>
<div id="nav"><button class="btn" onclick="go(-1)">&#8592;</button><div id="bar"><i></i></div><span id="tm" class="btn" onclick="tmr()">⏱ 5:00</span><span id="cnt"></span><button class="btn" onclick="go(1)">&#8594;</button></div>
<script>
const $=s=>document.querySelector(s);
const D={cornea:"Cornea: transparent front window; provides about two thirds of the eye’s focusing power.",iris:"Iris: coloured muscle that sets the pupil size.",pupil:"Pupil: the opening that admits light.",lens:"Lens: adjustable (accommodation) fine-focusing element.",retina:"Retina: light-sensitive neural layer with rods and cones.",choroid:"Choroid: blood-rich layer that nourishes the outer retina.",sclera:"Sclera: tough white outer coat that protects and shapes the eye.",nerve:"Optic nerve: about 1 million ganglion-cell axons carrying signals to the brain.",fovea:"Fovea: cone-rich pit for sharpest central vision.",disc:"Optic disc: where the nerve leaves; no photoreceptors, so it is the blind spot."};
function eye(x){return `<svg viewBox="0 0 420 300" class="eye ${x||''}" id="eye${x||''}">
<g class="hot" data-k="sclera"><circle cx="235" cy="150" r="96" fill="#0d1a33" stroke="#dbe9ff" stroke-width="6"/></g>
<g class="hot p" data-k="choroid"><circle cx="235" cy="150" r="89" fill="none" stroke="#8a5cff" stroke-width="4"/></g>
<g class="hot p" data-k="retina"><path d="M235 62A88 88 0 0 1 235 238" fill="none" stroke="#35e0ff" stroke-width="5"/></g>
<g class="hot p" data-k="cornea"><path d="M150 100Q108 150 150 200" fill="rgba(53,224,255,.15)" stroke="#7ff" stroke-width="5"/></g>
<g class="hot p" data-k="iris"><path d="M160 98V130M160 170V202" stroke="#b08cff" stroke-width="9" stroke-linecap="round"/></g>
<g class="hot p" data-k="lens"><ellipse cx="178" cy="150" rx="12" ry="30" fill="rgba(53,224,255,.35)" stroke="#35e0ff"/></g>
<g class="hot p" data-k="nerve"><rect x="324" y="162" width="76" height="22" rx="8" fill="#9fb4d6"/></g>
<g class="hot" data-k="fovea"><circle cx="323" cy="150" r="5" fill="#ffd36b"/></g>
<g class="hot" data-k="disc"><circle cx="324" cy="172" r="5" fill="#ff7a9c"/></g></svg>`}
function focus(p,l){const x=p==='m'?250:p==='h'?330:300;return `<svg viewBox="0 0 400 180"><ellipse cx="120" cy="90" rx="10" ry="40" fill="rgba(53,224,255,.3)" stroke="#35e0ff"/><line x1="300" y1="20" x2="300" y2="160" stroke="#35e0ff" stroke-width="4"/><g stroke="#ffd36b" stroke-width="2" fill="none"><path d="M10 50L120 60L${x} 90"/><path d="M10 130L120 120L${x} 90"/>${p!=='n'?`<path d="M${x} 90L${p==='m'?300:300} ${p==='m'?60:75}M${x} 90L300 ${p==='m'?120:105}"/>`:''}</g><circle cx="${x}" cy="90" r="4" fill="#fff"/><text x="200" y="175" fill="#8fa3c4" font-size="13" text-anchor="middle">${l}</text></svg>`}
const chips=a=>`<div class="chips">${a.map((x,i)=>(i?'<span class="ar">&#8594;</span>':'')+`<span class="chip">${x}</span>`).join('')}</div>`;
const Q=[["Which structure provides most of the eye’s focusing power?",["Lens","Cornea","Iris"],1,"The cornea (air–tissue boundary) provides about 60–70% of total refraction; the lens fine-tunes it."],["The image formed on the retina is…",["Upright","Inverted","Blurred always"],1,"Optics invert the image; the brain interprets it so we perceive the world upright."],["Which cells give colour vision?",["Rods","Cones","Ganglion cells only"],1,"Cones (L, M, S types) work in bright light and detect colour; rods handle dim light."],["In bright light the pupil…",["Constricts","Dilates","Stays fixed"],0,"The sphincter pupillae contracts through the parasympathetic pupillary light reflex."],["Fibres from which retinal half cross at the optic chiasm?",["Temporal","Nasal","Both halves"],1,"Nasal fibres cross, so each hemisphere receives the opposite visual field."]];
const S=[
`<div class="row"><div class="txt"><div class="k">Scientific presentation</div><h1>THE MECHANISM OF HUMAN VISION</h1><p style="font-size:clamp(18px,2.4vw,28px)">How Light Becomes Sight</p><p>Atharv Agrawal · B.Tech ARE, Sem 1 · Prestige Institute of Engineering Management &amp; Research, Indore</p><p style="color:var(--c)">Press → or tap to begin</p></div><div class="vis card">${eye('o')}</div></div>`,
`<div class="row"><div class="txt"><div class="k">Introduction</div><h2>What is vision?</h2><p>Vision is the process by which the visual system <b>detects light</b> and builds <b>perception</b> of the world.</p><ul><li>Eye: optics and sensor</li><li>Optic nerve and pathway: the cable</li><li>Brain: the processor</li></ul></div><div class="vis card">${chips(['Light','Eye','Retina','Optic nerve','Brain','Perception'])}</div></div>`,
`<div class="row"><div class="txt"><div class="k">Anatomy</div><h2>Anatomy of the Human Eye</h2><p>Tap any structure, or explode the model.</p><button class="btn" onclick="$('#eye3').classList.toggle('ex')">Toggle exploded view</button><div class="info" id="info">Select a part.</div></div><div class="vis card">${eye('3')}</div></div>`,
`<div class="row"><div class="txt"><div class="k">Optics</div><h2>A Natural Optical System</h2><p>The <b>cornea</b> bends light most (about 40 of ~60 dioptres). The <b>lens</b> adds adjustable focus: it thickens for near objects and flattens for far ones (<b>accommodation</b>).</p></div><div class="vis card">${focus('n','Cornea + lens converge rays onto the retina')}</div></div>`,
`<div class="row"><div class="txt"><div class="k">Journey of light</div><h2>The Journey of Light</h2><ol id="steps" style="padding-left:20px">${["Cornea: first refraction","Aqueous humour","Pupil","Lens refracts and focuses","Vitreous humour","Inverted image on retina","Photoreceptors make electrical signals","Optic nerve to brain"].map(x=>`<li class="step">${x}</li>`).join('')}</ol></div><div class="vis card"><svg viewBox="0 0 420 300" id="journey" style="position:absolute;opacity:0;pointer-events:none"></svg>${eye('5')}</div></div>`,
`<div class="row"><div class="txt"><div class="k">Iris &amp; pupil</div><h2>Pupil Size Regulation</h2><p>Two iris muscles control the pupil: <b>sphincter pupillae</b> (constricts, parasympathetic) and <b>dilator pupillae</b> (dilates, sympathetic).</p><p><b>Pupillary light reflex:</b></p>${chips(['Retina','Optic nerve','Pretectal nucleus','Edinger–Westphal','Oculomotor nerve','Sphincter'])}</div><div class="vis card"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="110" fill="#1b2a55"/><circle cx="150" cy="150" r="60" fill="#05070f"/><g stroke="#8a5cff" stroke-width="3"><path d="M150 90V40M150 210V260M90 150H40M210 150H260"/></g><text x="150" y="285" fill="#8fa3c4" font-size="14" text-anchor="middle">Radial dilator and circular sphincter muscles</text></svg></div></div>`,
`<div class="row"><div class="txt"><div class="k">Interactive</div><h2>Bright vs Dim Light</h2><button class="btn" onclick="pup(0)">Bright light</button><button class="btn" onclick="pup(100)">Dim light</button><p style="margin-top:12px"><input id="sl" type="range" min="0" max="100" value="0" oninput="pup(this.value)" style="width:100%"></p><div class="info" id="pinfo"></div></div><div class="vis card"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="120" fill="#e8f1ff"/><circle cx="150" cy="150" r="75" fill="#3b6bd6"/><circle cx="150" cy="150" r="75" fill="none" stroke="#8ab4ff" stroke-width="6" stroke-dasharray="3 5"/><circle id="pp" cx="150" cy="150" r="20" fill="#000"/><circle cx="130" cy="130" r="8" fill="#fff" opacity=".8"/></svg></div></div>`,
`<div class="row"><div class="txt"><div class="k">Image formation</div><h2>How the Eye Forms an Image</h2><p>Refraction at the cornea and lens brings rays to a point on the retina. The image is <b>real and inverted</b>. This is <b>image formation</b>; <b>perception</b> happens later in the brain.</p></div><div class="vis card"><svg viewBox="0 0 400 200"><path d="M20 40V150" stroke="#ffd36b" stroke-width="5"/><path d="M20 40L120 100L300 160M20 150L120 100L300 40" stroke="#35e0ff" stroke-width="2" fill="none"/><ellipse cx="120" cy="100" rx="9" ry="40" fill="rgba(53,224,255,.3)" stroke="#35e0ff"/><path d="M300 40V160" stroke="#ffd36b" stroke-width="5"/><text x="20" y="185" fill="#8fa3c4" font-size="12">Object</text><text x="280" y="185" fill="#8fa3c4" font-size="12">Inverted image</text></svg></div></div>`,
`<div class="row"><div class="txt"><div class="k">Retina</div><h2>The Light-Sensitive Layer</h2><p>Light passes through inner neurons before reaching the photoreceptors. Key landmarks: <b>fovea</b> (sharpest vision) and <b>optic disc</b> (blind spot).</p></div><div class="vis card"><svg viewBox="0 0 400 260">${[["Ganglion cells","#8a5cff"],["Bipolar cells","#4a7bff"],["Rods &amp; cones","#35e0ff"],["Pigment epithelium","#7a4a2b"],["Choroid","#a12b4b"]].map((l,i)=>`<rect x="30" y="${20+i*46}" width="340" height="36" rx="8" fill="${l[1]}" opacity=".75"/><text x="200" y="${43+i*46}" fill="#fff" font-size="15" text-anchor="middle">${l[0]}</text>`).join('')}<text x="12" y="14" fill="#ffd36b" font-size="12">&#8595; light enters from here</text></svg></div></div>`,
`<div class="row"><div class="txt"><div class="k">Photoreceptors</div><h2>Rods vs Cones</h2></div><div class="vis card"><table style="width:100%;color:var(--t);font-size:15px;border-collapse:collapse"><tr style="color:var(--c)"><th></th><th>Rods</th><th>Cones</th></tr>${[["Number","~120 million","~6 million"],["Best in","Dim light","Bright light"],["Colour","No","Yes (L, M, S)"],["Detail","Low","High"],["Location","Periphery","Concentrated at fovea"]].map(r=>`<tr>${r.map(c=>`<td style="padding:7px;border-top:1px solid var(--b)">${c}</td>`).join('')}</tr>`).join('')}</table></div></div>`,

d.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;d.querySelectorAll('.qo').forEach(x=>x.disabled=true);b.classList.add(k==q[2]?'ok':'no');d.querySelectorAll('.qo')[q[2]].classList.add('ok');if(k==q[2])sc++;setTimeout(()=>{i++;r()},1100)})})()};
